<!DOCTYPE html>
<!-- [html-validate-disable empty-title, empty-heading, text-content, unique-landmark -- configured by config.js before interaction] -->
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#21493d">
    <meta id="page-description" name="description" content="">
    <title>CMT Connections</title>
    <link rel="icon" type="image/png" href="assets/cmt-wheel-logo-grunge.png">
    <link rel="apple-touch-icon" href="assets/cmt-wheel-logo-grunge.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="page-loading">
    <div id="top-border" class="knotwork-band knotwork-band-top" aria-label="Decorative border">
      <div class="knotwork-track" aria-hidden="true">
        <img src="assets/knotwork-border-end.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
      </div>
    </div>
    <div class="page-shell">
      <header id="site-header" class="site-header">
        <button id="wheel-trigger" class="brand-mark is-entering" type="button" aria-label="Secret bonus round">
          <img src="assets/cmt-wheel-logo-grunge.png" alt="">
        </button>
        <div>
          <p id="header-eyebrow" class="eyebrow"></p>
          <img id="header-title" class="wordmark" src="assets/wordmark.png" alt="">
        </div>
      </header>

      <main>
        <section id="welcome-screen" class="welcome-card" aria-labelledby="welcome-title">
          <h1 id="welcome-title"></h1>
          <section class="welcome-instructions" aria-labelledby="welcome-instructions-title">
            <h2 id="welcome-instructions-title"></h2>
            <ul id="welcome-copy"></ul>
          </section>

          <form id="team-form" class="team-form" novalidate>
            <label id="team-name-label" for="team-name"></label>
            <div class="input-action">
              <input
                id="team-name"
                name="teamName"
                type="text"
                maxlength="60"
                minlength="3"
                autocomplete="off"
                enterkeyhint="go"
                required
                aria-describedby="team-error"
              >
              <button id="begin-game" class="button button-primary" type="submit"></button>
            </div>
            <p id="team-error" class="form-message" aria-live="polite"></p>
          </form>

        </section>

        <section id="game-screen" class="game-screen" hidden aria-labelledby="game-heading">
          <div class="game-heading-row">
            <div>
              <p id="playing-as-label" class="eyebrow"></p>
              <h1 id="game-heading" class="team-heading"></h1>
            </div>
          </div>

          <section id="score-card" class="score-card" aria-labelledby="score-label">
            <div class="score-line">
              <span id="score-label"></span>
              <strong id="score-value"></strong>
            </div>
            <progress
              id="score-track"
              class="score-track"
              max="100"
              value="100"
            ></progress>
            <p id="score-note" class="score-note"></p>
          </section>

          <section id="board" class="board">
            <div id="resolved-groups" class="resolved-groups" role="group"></div>
            <div id="word-grid" class="word-grid" role="group"></div>
          </section>

          <form id="word-form" class="word-form" novalidate>
            <label id="word-input-label" for="word-input"></label>
            <div class="input-action">
              <input
                id="word-input"
                name="word"
                type="text"
                autocomplete="off"
                autocapitalize="characters"
                enterkeyhint="done"
                spellcheck="false"
              >
              <button id="add-word" class="button button-dark" type="submit"></button>
            </div>
            <p id="word-feedback" class="form-message" aria-live="polite" aria-atomic="true"></p>
          </form>

          <div id="game-actions" class="game-actions" role="group">
            <button id="submit-group" class="button button-primary submit-button" type="button" disabled>
            </button>
            <div class="secondary-actions">
              <button id="deselect-all" class="button button-secondary" type="button" disabled></button>
              <button id="shuffle" class="button button-secondary" type="button" disabled></button>
            </div>
          </div>

          <footer class="game-footer">
            <button id="reset-game" class="text-button muted" type="button"></button>
            <button id="open-map" class="text-button" type="button" hidden></button>
            <button id="reveal-words-link" class="text-button" type="button" hidden></button>
            <span id="result-separator" class="result-separator" aria-hidden="true" hidden>.</span>
            <button id="view-result" class="text-button" type="button" hidden></button>
          </footer>
        </section>
      </main>
    </div>

    <div id="bottom-border" class="knotwork-band knotwork-band-bottom" aria-label="Decorative border">
      <div class="knotwork-track" aria-hidden="true">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border.png" alt="">
        <img src="assets/knotwork-border-end.png" alt="">
      </div>
    </div>

    <div id="feedback-banner" class="feedback-banner" role="status" aria-live="assertive" aria-atomic="true" hidden></div>

    <dialog id="completion-dialog" class="completion-dialog" aria-labelledby="completion-title">
      <div class="completion-panel">
        <button id="close-completion" class="dialog-close" type="button">×</button>
        <p id="completion-kicker" class="section-kicker"></p>
        <h2 id="completion-title"></h2>
        <div class="final-score-wrap">
          <span id="final-score" class="final-score"></span>
          <span id="points-label"></span>
        </div>
        <p id="ranking-label" class="ranking-label"></p>

        <div class="result-section">
          <h3 id="solve-order-heading"></h3>
          <p id="solve-order" class="solve-order" role="img"></p>
        </div>

        <div class="result-section">
          <h3 id="guesses-heading"></h3>
          <div id="guess-history" class="guess-history" role="group"></div>
        </div>

        <button id="copy-result" class="button button-primary copy-button" type="button"></button>
        <p id="copy-status" class="copy-status" aria-live="polite"></p>
        <p id="submission-status" class="submission-status" aria-live="polite"></p>
      </div>
    </dialog>

    <div id="bonus-dialog" class="bonus-dialog" role="dialog" aria-modal="true" aria-labelledby="bonus-title" hidden>
      <div class="completion-panel bonus-panel">
        <button id="close-bonus" class="dialog-close" type="button" aria-label="Close bonus round">×</button>
        <h2 id="bonus-title"></h2>
        <p id="bonus-instructions" class="bonus-instructions"></p>
        <div id="bonus-grid" class="bonus-grid" role="group"></div>
        <div class="bonus-status">
          <span id="bonus-hint" class="bonus-hint" hidden></span>
          <div id="bonus-lives" class="bonus-lives" role="img"></div>
        </div>
        <button id="bonus-submit" class="button button-primary copy-button" type="button"></button>
        <p id="bonus-feedback" class="copy-status" aria-live="polite"></p>
      </div>
    </div>

    <div id="map-dialog" class="map-dialog" role="dialog" aria-modal="true" aria-labelledby="map-title" hidden>
      <div class="completion-panel map-panel">
        <button id="close-map" class="dialog-close" type="button">×</button>
        <h2 id="map-title"></h2>
        <div id="map-image-frame" class="map-image-frame">
          <img id="map-image" src="assets/cmt_map_rotated.png" alt="Map of the Cambridge Museum of Technology">
        </div>
      </div>
    </div>

    <dialog id="word-reveal-dialog" class="completion-dialog word-reveal-dialog" aria-labelledby="word-reveal-title">
      <div class="completion-panel word-reveal-panel">
        <button id="close-word-reveal" class="dialog-close" type="button">×</button>
        <h2 id="word-reveal-title"></h2>
        <p id="word-reveal-message" class="word-reveal-message"></p>
        <div class="word-reveal-actions">
          <button id="reveal-words" class="button button-primary" type="button"></button>
          <button id="keep-solving" class="text-button" type="button"></button>
        </div>
      </div>
    </dialog>

    <div id="fatal-error" class="fatal-error" role="alert" hidden></div>

    <script src="config.js"></script>
    <script src="personalized-welcomes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
